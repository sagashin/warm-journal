<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a6b5d"/>
      <stop offset="100%" stop-color="#2d483e"/>
    </linearGradient>
    <linearGradient id="bookmark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d99b66"/>
      <stop offset="100%" stop-color="#b87844"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ベース角丸 -->
  <rect width="192" height="192" rx="44" fill="url(#bg)"/>

  <!-- 手帳本体 -->
  <g filter="url(#shadow)">
    <!-- カバー外枠 -->
    <rect x="36" y="32" width="120" height="128" rx="10" fill="#f4efe6" stroke="#e0d6c5" stroke-width="2"/>
    <!-- 革帯・背表紙 -->
    <rect x="36" y="32" width="22" height="128" rx="4" fill="#3b584c"/>
    <line x1="58" y1="32" x2="58" y2="160" stroke="#2a4238" stroke-width="2"/>

    <!-- しおりリボン -->
    <path d="M110 32 L110 92 L118 84 L126 92 L126 32 Z" fill="url(#bookmark)"/>

    <!-- 手帳の罫線装飾 -->
    <line x1="72" y1="64" x2="136" y2="64" stroke="#d5ccbb" stroke-width="3" stroke-linecap="round"/>
    <line x1="72" y1="80" x2="136" y2="80" stroke="#d5ccbb" stroke-width="3" stroke-linecap="round"/>
    <line x1="72" y1="96" x2="136" y2="96" stroke="#d5ccbb" stroke-width="3" stroke-linecap="round"/>
    <line x1="72" y1="112" x2="116" y2="112" stroke="#d5ccbb" stroke-width="3" stroke-linecap="round"/>

    <!-- 心が温まる小さな若葉シンボル -->
    <path d="M128 136 C128 126 138 122 144 122 C144 130 136 142 128 136 Z" fill="#4a6b5d"/>
  </g>
</svg>
