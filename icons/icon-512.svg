<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a6b5d"/>
      <stop offset="100%" stop-color="#284238"/>
    </linearGradient>
    <linearGradient id="bookmark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d99b66"/>
      <stop offset="100%" stop-color="#b87844"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ベース角丸 -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- 手帳本体 -->
  <g filter="url(#shadow)">
    <!-- カバー外枠 -->
    <rect x="96" y="80" width="320" height="352" rx="24" fill="#f6f2ea" stroke="#e0d6c5" stroke-width="4"/>
    <!-- 革帯・背表紙 -->
    <rect x="96" y="80" width="60" height="352" rx="10" fill="#385448"/>
    <line x1="156" y1="80" x2="156" y2="432" stroke="#253a31" stroke-width="4"/>

    <!-- しおりリボン -->
    <path d="M290 80 L290 230 L310 210 L330 230 L330 80 Z" fill="url(#bookmark)"/>

    <!-- 手帳の罫線装飾 -->
    <line x1="190" y1="160" x2="360" y2="160" stroke="#d5ccbb" stroke-width="8" stroke-linecap="round"/>
    <line x1="190" y1="200" x2="360" y2="200" stroke="#d5ccbb" stroke-width="8" stroke-linecap="round"/>
    <line x1="190" y1="240" x2="360" y2="240" stroke="#d5ccbb" stroke-width="8" stroke-linecap="round"/>
    <line x1="190" y1="280" x2="300" y2="280" stroke="#d5ccbb" stroke-width="8" stroke-linecap="round"/>

    <!-- 心が温まる若葉シンボル -->
    <path d="M330 360 C330 330 360 320 375 320 C375 345 355 375 330 360 Z" fill="#4a6b5d"/>
  </g>
</svg>
